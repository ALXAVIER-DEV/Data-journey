name: Deploy DEV

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - develop

jobs:

  upload-artifacts:
    runs-on: ubuntu-latest
    environment: dev

    env:
      AWS_REGION: sa-east-1
      ROLE_TO_ASSUME: arn:aws:iam::584047610071:role/github-actions-deploy-role-axcloud
      S3_BUCKET: dev-axcloud-lab-sa-east-1-data
      SQL_S3_KEY: sql/dml/insert_curated_messages.sql
      GLUE_SCRIPT_S3_KEY: glue/python_shell/runner.py
      LAMBDA_S3_KEY: lambda/lambda.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC

      - name: Ensure artifact bucket exists
        run: |
          set -euo pipefail

          if aws s3api head-bucket --bucket "${S3_BUCKET}" 2>/dev/null; then
            echo "Bucket ${S3_BUCKET} ja existe."
          else
            if [ "${AWS_REGION}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "${S3_BUCKET}"
            else
              aws s3api create-bucket \
                --bucket "${S3_BUCKET}" \
                --create-bucket-configuration LocationConstraint="${AWS_REGION}"
            fi

            aws s3api wait bucket-exists --bucket "${S3_BUCKET}"
            echo "Bucket ${S3_BUCKET} criado."
          fi

      - name: Build and upload Lambda ZIP
        run: |
          set -euo pipefail

          echo "Criando ZIP da Lambda..."
          cd src/lambda_ingest

          if [ -f requirements.txt ]; then
            echo "Instalando dependencias..."
            pip install -r requirements.txt -t . --quiet
          fi

          zip -r ../../lambda.zip . \
            -x "*.pyc" \
            -x "*__pycache__*" \
            -x "*.git*" \
            -x "*.md"

          cd ../..
          ls -lh lambda.zip

          aws s3 cp lambda.zip \
            "s3://${S3_BUCKET}/${LAMBDA_S3_KEY}" \
            --region "${AWS_REGION}"

          echo "ZIP enviado: s3://${S3_BUCKET}/${LAMBDA_S3_KEY}"

      - name: Upload Athena DML to S3
        run: |
          set -euo pipefail
          bash scripts/validate-athena-sql.sh athena/dml/insert_curated_messages.sql
          aws s3 cp "athena/dml/insert_curated_messages.sql" \
            "s3://${S3_BUCKET}/${SQL_S3_KEY}" \
            --region "${AWS_REGION}"
          echo "SQL enviado: s3://${S3_BUCKET}/${SQL_S3_KEY}"

      - name: Upload Glue script to S3
        run: |
          set -euo pipefail
          bash scripts/validate-glue-runner.sh glue/python_shell/runner.py
          aws s3 cp "glue/python_shell/runner.py" \
            "s3://${S3_BUCKET}/${GLUE_SCRIPT_S3_KEY}" \
            --region "${AWS_REGION}"
          echo "Glue script enviado: s3://${S3_BUCKET}/${GLUE_SCRIPT_S3_KEY}"

  terraform:
    needs: upload-artifacts
    uses: ./.github/workflows/terraform.yml
    with:
      environment: dev
      aws-assume-role-arn: arn:aws:iam::584047610071:role/github-actions-deploy-role-axcloud
      aws-region: sa-east-1
      aws-statefile-bucket: axcloud-lab-sa-east-1-terraform-state
      aws-lock-athena-table: axcloud_lab_terraform_locks

  deploy:
    runs-on: ubuntu-latest
    needs: terraform
    environment: dev

    env:
      AWS_REGION: sa-east-1
      ROLE_TO_ASSUME: arn:aws:iam::584047610071:role/github-actions-deploy-role-axcloud
      S3_BUCKET: dev-axcloud-lab-sa-east-1-data
      LAMBDA_NAME: dev-axcloud-lab-lambda-ingest
      GLUE_JOB_NAME: dev-axcloud-lab-glue-shell-athena-exec
      SNS_TOPIC_ARN: arn:aws:sns:sa-east-1:584047610071:dev-axcloud-lab-topic-ingest
      GLUE_SCRIPT_S3_KEY: glue/python_shell/runner.py
      LAMBDA_S3_KEY: lambda/lambda.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC

      - name: Deploy Lambda
        run: |
          set -euo pipefail

          if aws lambda get-function \
              --function-name "${LAMBDA_NAME}" \
              --region "${AWS_REGION}" > /dev/null 2>&1; then

            echo "Funcao existe. Atualizando codigo..."

            aws s3 cp "s3://${S3_BUCKET}/${LAMBDA_S3_KEY}" \
              lambda.zip --region "${AWS_REGION}"

            aws lambda update-function-code \
              --function-name "${LAMBDA_NAME}" \
              --zip-file "fileb://lambda.zip" \
              --region "${AWS_REGION}"

            aws lambda wait function-updated \
              --function-name "${LAMBDA_NAME}" \
              --region "${AWS_REGION}"

            echo "Lambda atualizada com sucesso."
          else
            echo "::error::Lambda '${LAMBDA_NAME}' nao existe em ${AWS_REGION}."
            exit 1
          fi

      - name: Update Glue Job script location
        run: |
          set -euo pipefail

          JOB_JSON=$(aws glue get-job \
            --job-name "${GLUE_JOB_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Job' \
            --output json)

          GLUE_ROLE=$(echo "${JOB_JSON}" | jq -r '.Role')

          echo "Role atual do Glue Job: $GLUE_ROLE"

          JOB_UPDATE=$(echo "${JOB_JSON}" | jq \
            --arg script_location "s3://${S3_BUCKET}/${GLUE_SCRIPT_S3_KEY}" \
            'del(
              .AllocatedCapacity,
              .Command.ScriptLocation,
              .CreatedOn,
              .LastModifiedOn,
              .Name,
              .MaxRetries,
              .ExecutionClass,
              .LogUri,
              .MaintenanceWindow,
              .PredecessorRuns,
              .ProfileName,
              .State,
              .WorkerType,
              .NumberOfWorkers,
              .SecurityConfiguration,
              .NotificationProperty,
              .CodeGenConfigurationNodes,
              .Connections,
              .Timeout,
              .SourceControlDetails,
              .ExecutionProperty
            ) |
            .Command.Name = "pythonshell" |
            .Command.PythonVersion = "3.9" |
            .Command.ScriptLocation = $script_location')

          aws glue update-job \
            --job-name "${GLUE_JOB_NAME}" \
            --region "${AWS_REGION}" \
            --job-update "${JOB_UPDATE}"

          echo "Glue Job atualizado: ${GLUE_JOB_NAME}"

      - name: Smoke test - publish SNS message
        run: |
          set -euo pipefail
          MESSAGE_ID=$(aws sns publish \
            --topic-arn "${SNS_TOPIC_ARN}" \
            --message "{\"hello\":\"world\",\"from\":\"github-actions-dev\"}" \
            --region "${AWS_REGION}" \
            --query 'MessageId' \
            --output text)
          echo "SNS publicado. MessageId: $MESSAGE_ID"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy DEV falhou. Verifique os logs acima."

