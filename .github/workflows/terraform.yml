name: "Terraform Workflow"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws-assume-role-arn:
        type: string
        required: true
      aws-region:
        type: string
        required: true
      aws-statefile-bucket:
        type: string
        required: true
      aws-lock-athena-table:
        type: string
        required: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          role-to-assume: ${{ inputs.aws-assume-role-arn }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ inputs.aws-region }}

      - name: Ensure Terraform backend exists
        run: |
          set -euo pipefail

          BUCKET="${{ inputs.aws-statefile-bucket }}"
          REGION="${{ inputs.aws-region }}"
          LOCK_TABLE="${{ inputs.aws-lock-athena-table }}"
          DDB_LOCK_ENABLED="false"

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket \
                --bucket "$BUCKET" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api wait bucket-exists --bucket "$BUCKET"
          fi

          if aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$REGION" >/dev/null 2>&1; then
            DDB_LOCK_ENABLED="true"
          else
            DDB_ERR="$(aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$REGION" 2>&1 || true)"
            if echo "$DDB_ERR" | grep -q "ResourceNotFoundException"; then
              CREATE_ERR_FILE="$(mktemp)"
              if aws dynamodb create-table \
                --table-name "$LOCK_TABLE" \
                --attribute-definitions AttributeName=LockID,AttributeType=S \
                --key-schema AttributeName=LockID,KeyType=HASH \
                --billing-mode PAY_PER_REQUEST \
                --region "$REGION" >/dev/null 2>"$CREATE_ERR_FILE"; then
                aws dynamodb wait table-exists --table-name "$LOCK_TABLE" --region "$REGION"
                DDB_LOCK_ENABLED="true"
              else
                CREATE_ERR="$(cat "$CREATE_ERR_FILE")"
                if echo "$CREATE_ERR" | grep -q "AccessDeniedException"; then
                  echo "Warning: sem permissao para criar tabela DynamoDB. Continuando sem state locking."
                  DDB_LOCK_ENABLED="false"
                else
                  echo "$CREATE_ERR"
                  exit 1
                fi
              fi
              rm -f "$CREATE_ERR_FILE"
            elif echo "$DDB_ERR" | grep -q "AccessDeniedException"; then
              echo "Warning: sem permissao para descrever tabela DynamoDB. Continuando sem state locking."
              DDB_LOCK_ENABLED="false"
            else
              echo "$DDB_ERR"
              exit 1
            fi
          fi

          echo "TF_DDB_LOCK_ENABLED=$DDB_LOCK_ENABLED" >> "$GITHUB_ENV"
          echo "TF_DDB_LOCK_TABLE=$LOCK_TABLE" >> "$GITHUB_ENV"

      - name: Terraform Initialize
        run: |
          cd infra/terraform
          if [ "${TF_DDB_LOCK_ENABLED}" = "true" ]; then
            terraform init -input=false \
              -backend-config="bucket=${{ inputs.aws-statefile-bucket }}" \
              -backend-config="key=${{ github.repository }}/${{ inputs.environment }}/terraform.tfstate" \
              -backend-config="region=${{ inputs.aws-region }}" \
              -backend-config="dynamodb_table=${TF_DDB_LOCK_TABLE}" \
              -backend-config="encrypt=true"
          else
            terraform init -input=false \
              -backend-config="bucket=${{ inputs.aws-statefile-bucket }}" \
              -backend-config="key=${{ github.repository }}/${{ inputs.environment }}/terraform.tfstate" \
              -backend-config="region=${{ inputs.aws-region }}" \
              -backend-config="encrypt=true"
          fi

      - name: Terraform Validate
        run: |
          cd infra/terraform
          terraform validate

      - name: Force unlock stale state lock
        if: env.TF_DDB_LOCK_ENABLED == 'true'
        run: |
          set -euo pipefail

          cd infra/terraform
          terraform workspace select -or-create=true ${{ inputs.environment }}

          LOCK_KEY="${{ inputs.aws-statefile-bucket }}/env:/${{ inputs.environment }}/${{ github.repository }}/${{ inputs.environment }}/terraform.tfstate"

          LOCK_ITEM=$(aws dynamodb get-item \
            --table-name "${{ inputs.aws-lock-athena-table }}" \
            --region "${{ inputs.aws-region }}" \
            --key "{\"LockID\": {\"S\": \"$LOCK_KEY\"}}" \
            --query 'Item' \
            --output json 2>/dev/null || echo "null")

          if [ "$LOCK_ITEM" != "null" ] && [ -n "$LOCK_ITEM" ]; then
            LOCK_ID=$(echo "$LOCK_ITEM" | jq -r '.Info.S // empty' | jq -r '.ID // empty' 2>/dev/null || echo "")
            CREATED=$(echo "$LOCK_ITEM" | jq -r '.Info.S // empty' | jq -r '.Created // empty' 2>/dev/null || echo "desconhecido")
            echo "Lock detectado. Criado em: $CREATED"

            if [ -n "$LOCK_ID" ]; then
              terraform force-unlock -force "$LOCK_ID"
              echo "Lock removido via terraform force-unlock: $LOCK_ID"
            else
              aws dynamodb delete-item \
                --table-name "${{ inputs.aws-lock-athena-table }}" \
                --region "${{ inputs.aws-region }}" \
                --key "{\"LockID\": {\"S\": \"$LOCK_KEY\"}}"
              echo "Lock removido diretamente no DynamoDB."
            fi
          else
            echo "Nenhum lock ativo encontrado. Prosseguindo."
          fi

      - name: Migrate renamed resources out of state
        run: |
          set -euo pipefail

          cd infra/terraform
          terraform workspace select -or-create=true ${{ inputs.environment }}

          TFVARS_FILE="./modules/envs/${{ inputs.environment }}/terraform.tfvars"

          read_tfvar() {
            local key="$1"
            sed -n "s/^${key}[[:space:]]*=[[:space:]]*\"\\(.*\\)\"/\\1/p" "$TFVARS_FILE"
          }

          state_attr() {
            local address="$1"
            local attribute="$2"

            terraform state show "$address" 2>/dev/null \
              | sed -n "s/^[[:space:]]*${attribute}[[:space:]]*=[[:space:]]*\"\\(.*\\)\"/\\1/p" \
              | head -n 1
          }

          remove_if_mismatch() {
            local address="$1"
            local attribute="$2"
            local expected="$3"

            if terraform state show "$address" > /dev/null 2>&1; then
              local current
              current="$(state_attr "$address" "$attribute")"

              echo "Verificando $address"
              echo "  atributo esperado: $attribute"
              echo "  valor atual no state: ${current:-<vazio>}"
              echo "  valor esperado: ${expected:-<vazio>}"

              if [ -n "$current" ] && [ "$current" != "$expected" ]; then
                echo "State antigo detectado em $address: '$current' -> '$expected'"
                terraform state rm "$address"
              else
                echo "Sem divergencia em $address"
              fi
            else
              echo "$address nao existe no state. Nada a remover."
            fi
          }

          ENVIRONMENT="$(read_tfvar environment)"
          PROJECT_NAME="$(read_tfvar project_name)"
          AWS_REGION_TFVARS="$(read_tfvar aws_region)"

          if [ -z "$ENVIRONMENT" ] || [ -z "$PROJECT_NAME" ] || [ -z "$AWS_REGION_TFVARS" ]; then
            echo "::error::Nao foi possivel ler environment, project_name ou aws_region de $TFVARS_FILE"
            exit 1
          fi

          PREFIX="${ENVIRONMENT}-${PROJECT_NAME}"

          DESIRED_BUCKET="${PREFIX}-${AWS_REGION_TFVARS}-data"
          DESIRED_LAMBDA="${PREFIX}-lambda-ingest"
          DESIRED_GLUE="${PREFIX}-glue-shell-athena-exec"
          DESIRED_SNS="${PREFIX}-topic-ingest"

          echo "Nomes desejados calculados:"
          echo "  bucket: $DESIRED_BUCKET"
          echo "  lambda: $DESIRED_LAMBDA"
          echo "  glue:   $DESIRED_GLUE"
          echo "  sns:    $DESIRED_SNS"

          # Tratamento explicito do bucket, por ser recurso critico com prevent_destroy
          if terraform state show 'aws_s3_bucket.data_bucket[0]' > /dev/null 2>&1; then
            CURRENT_BUCKET="$(state_attr 'aws_s3_bucket.data_bucket[0]' 'bucket')"

            echo "Bucket no state: ${CURRENT_BUCKET:-<vazio>}"
            echo "Bucket esperado: $DESIRED_BUCKET"

            if [ -n "$CURRENT_BUCKET" ] && [ "$CURRENT_BUCKET" != "$DESIRED_BUCKET" ]; then
              echo "Removendo bucket legado do state: $CURRENT_BUCKET"
              terraform state rm 'aws_s3_bucket.data_bucket[0]'
            else
              echo "Bucket no state ja esta aderente ao naming atual."
            fi
          else
            echo "aws_s3_bucket.data_bucket[0] nao existe no state."
          fi

          remove_if_mismatch 'aws_lambda_function.ingest' 'function_name' "$DESIRED_LAMBDA"
          remove_if_mismatch 'aws_glue_job.athena_exec' 'name' "$DESIRED_GLUE"
          remove_if_mismatch 'aws_sns_topic.ingest' 'name' "$DESIRED_SNS"
          remove_if_mismatch 'aws_iam_role.lambda_exec' 'name' "${DESIRED_LAMBDA}-role"
          remove_if_mismatch 'aws_iam_role.glue_exec' 'name' "${DESIRED_GLUE}-role"
          remove_if_mismatch 'aws_iam_role_policy.lambda_permissions' 'name' "${DESIRED_LAMBDA}-policy"
          remove_if_mismatch 'aws_iam_role_policy.glue_permissions' 'name' "${DESIRED_GLUE}-policy"

      - name: Import existing resources
        run: |
          set -euo pipefail

          cd infra/terraform
          terraform workspace select -or-create=true ${{ inputs.environment }}

          TFVARS_FILE="./modules/envs/${{ inputs.environment }}/terraform.tfvars"

          read_tfvar() {
            local key="$1"
            sed -n "s/^${key}[[:space:]]*=[[:space:]]*\"\\(.*\\)\"/\\1/p" "$TFVARS_FILE"
          }

          ENVIRONMENT="$(read_tfvar environment)"
          PROJECT_NAME="$(read_tfvar project_name)"
          AWS_REGION_TFVARS="$(read_tfvar aws_region)"
          CREATE_DATA_BUCKET="$(sed -n 's/^create_data_bucket[[:space:]]*=[[:space:]]*\(.*\)/\1/p' "$TFVARS_FILE" | tr -d '[:space:]')"

          if [ -z "$ENVIRONMENT" ] || [ -z "$PROJECT_NAME" ] || [ -z "$AWS_REGION_TFVARS" ]; then
            echo "::error::Nao foi possivel ler environment, project_name ou aws_region de $TFVARS_FILE"
            exit 1
          fi

          if [ "$CREATE_DATA_BUCKET" != "true" ]; then
            echo "create_data_bucket=$CREATE_DATA_BUCKET. Pulando import do bucket."
            exit 0
          fi

          DATA_BUCKET="${ENVIRONMENT}-${PROJECT_NAME}-${AWS_REGION_TFVARS}-data"

          if ! terraform state show 'aws_s3_bucket.data_bucket[0]' > /dev/null 2>&1; then
            if aws s3api head-bucket --bucket "$DATA_BUCKET" 2>/dev/null; then
              echo "Importando bucket existente: $DATA_BUCKET"
              terraform import \
                -input=false \
                -var-file="$TFVARS_FILE" \
                'aws_s3_bucket.data_bucket[0]' \
                "$DATA_BUCKET"
            else
              echo "Bucket $DATA_BUCKET nao existe na AWS. Sera criado pelo Terraform."
            fi
          else
            echo "aws_s3_bucket.data_bucket[0] ja esta no state. Pulando import."
          fi

      - name: Remove legacy Glue log group from Terraform state
        if: inputs.environment == 'dev'
        run: |
          set -euo pipefail

          cd infra/terraform
          terraform workspace select -or-create=true ${{ inputs.environment }}
          STATE_LIST="$(terraform state list || true)"

          if printf '%s\n' "$STATE_LIST" | grep -Fxq 'aws_cloudwatch_log_group.glue'; then
            terraform state rm aws_cloudwatch_log_group.glue
          else
            echo "aws_cloudwatch_log_group.glue nao existe no state. Nada a remover."
          fi

      - name: Terraform Plan
        id: terraform-plan
        run: |
          cd infra/terraform
          terraform workspace select -or-create=true ${{ inputs.environment }}
          terraform plan \
            -input=false \
            -var-file="./modules/envs/${{ inputs.environment }}/terraform.tfvars" \
            -out="${{ inputs.environment }}.plan"

      - name: Terraform Apply
        id: terraform-apply
        run: |
          cd infra/terraform
          terraform workspace select -or-create=true ${{ inputs.environment }}
          terraform apply -auto-approve -input=false "${{ inputs.environment }}.plan"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Terraform falhou no ambiente ${{ inputs.environment }}"
          echo "::error::Verifique os logs acima para detalhes do erro"

          
